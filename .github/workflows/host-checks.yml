name: Host checks (no GPU)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node.js 24)
        with:
          python-version: '3.12'
      - name: Obtain pinned LLVM 20.1.8
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $installer=Join-Path $env:RUNNER_TEMP 'LLVM-20.1.8-win64.exe'
          Invoke-WebRequest 'https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-win64.exe' -OutFile $installer
          if((Get-FileHash $installer).Hash -ne '3197846a2b19063687dd56e93e34cd941e3548d907f23a6131571321bdf9fe7b'){throw 'LLVM checksum mismatch'}
          $llvm=Join-Path $env:RUNNER_TEMP 'llvm'
          & 7z x $installer "-o$llvm" -y | Out-Null
          if($LASTEXITCODE -ne 0){throw 'LLVM extraction failed'}
          (Join-Path $llvm 'bin') | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Public text and fixture-independent checks
        shell: powershell
        run: .\Test.ps1
      - name: Diagnostic v4 simulated checks
        shell: powershell
        run: .\Test-Diagnostic.ps1
      - name: Three EFI modes and exact candidate hashes
        shell: powershell
        run: |
          .\Build.ps1
          .\Build.ps1 -Experimental
          $efi='src/build/pny3080ti/experimental-preserve-ss1/PNY3080TI.EFI'
          if((Get-FileHash $efi).Hash -ne '4fd4143b57acbdbd68e57a3b792bcebcf73f5b48612ea788b47347338c9b1167'){throw 'Fixed-SS0 hardening candidate differs from reviewed build'}
          .\Build.ps1 -Experimental -DynamicEntrySs0
          $dynamic='src/build/pny3080ti/experimental-dynamic-ss0-preserve-ss1/PNY3080TI.EFI'
          if((Get-FileHash $dynamic).Hash -ne 'b04ce9ff5b484c4dd069778ed8102199fbced2db977bef745041793632990844'){throw 'Dynamic-SS0 hardening candidate differs from reviewed build'}
      - name: Mocked USB file copy (no physical device)
        shell: powershell
        run: |
          .\tools\Test-CopyUsb.ps1
          .\tools\Test-CopyUsb.ps1 -DynamicEntrySs0
      - name: Explicit scope
        shell: pwsh
        run: |
          Write-Output 'No GPU, firmware execution or private PROM in CI. 126 original / 225 dynamic fixture scenarios are skipped here; local results are documented separately.'
